<!doctype html>
<!--
  The Open Graph card, rendered to public/og.png at 1200×630:
    npx playwright screenshot --viewport-size=1200,630 scripts/og.html public/og.png
  (any Chromium works; the fonts come from Google Fonts at render time).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Outfit:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #fafafa;
        color: #060606;
        font-family: Geist, sans-serif;
        overflow: hidden;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(6, 6, 6, 0.16) 1px,
          transparent 1.5px
        );
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(
          ellipse 75% 80% at 50% 0%,
          #000 10%,
          transparent 70%
        );
      }
      .rail {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #dedede;
      }
      .card {
        position: absolute;
        inset: 64px 72px;
        padding: 56px 64px;
        border: 1px solid #dedede;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: Outfit, sans-serif;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      .brand i {
        display: inline-block;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: #171717;
      }
      .pill {
        margin-left: auto;
        font-family: "Geist Mono", monospace;
        font-size: 17px;
        color: #525252;
        border: 1px solid #dedede;
        border-radius: 999px;
        padding: 8px 16px;
        background: #fafafa;
      }
      h1 {
        font-family: Outfit, sans-serif;
        font-weight: 500;
        font-size: 46px;
        line-height: 1.12;
        color: #737373;
        letter-spacing: -0.005em;
      }
      h1 b {
        font-weight: 700;
        color: #060606;
      }
      h1 .l2 {
        display: block;
        font-weight: 700;
        font-size: 58px;
        line-height: 1.05;
        margin-top: 8px;
      }
      p {
        font-size: 22px;
        line-height: 1.45;
        color: #525252;
        max-width: 30ch;
        margin-top: 22px;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 28px;
        font-family: "Geist Mono", monospace;
        font-size: 17px;
        color: #737373;
      }
      .foot b {
        color: #060606;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="rail" style="left: 24px"></div>
    <div class="rail" style="right: 24px"></div>
    <div class="card">
      <div class="brand">
        <i></i>intelligo <span class="pill">v1.0.0-beta.3 · Apache-2.0</span>
      </div>
      <div>
        <h1>
          You build the <b>agent.</b
          ><span class="l2"
            ><span style="color: #737373">Intelligo is</span> everything around
            it.</span
          >
        </h1>
        <p>
          The open-source application framework for vertical AI SaaS — auth,
          workspaces, billing, credits, pages and operations.
        </p>
      </div>
      <div class="foot">
        <b>intelligo.dev</b><span>github.com/intelligo-dev/framework</span
        ><span>npm · @intelligo-dev/*</span>
      </div>
    </div>
  </body>
</html>
