name: Release

# Publishes every public package to npm when main carries a version
# npm does not have yet.
#
# A release is one commit: bump every packages/*/package.json to the
# new version and head CHANGELOG.md with a section for it. Once CI has
# passed on that commit, this workflow builds, runs the full suite,
# packs each package and publishes it, pushes the `vX.Y.Z` tag and
# creates a GitHub release whose notes are that CHANGELOG section.
# Nothing here is a second source of truth: the version is what the
# manifests say, the notes are what the changelog says.
#
# There is no npm token. Every @intelligo-dev package names this file,
# in the `npm` environment of intelligo-dev/intelligo, as its trusted
# publisher; npm checks the run's OIDC identity at publish time and
# attaches provenance. The registry work OIDC cannot do — deprecating
# a folded package, moving a dist-tag — is scripts/npm-maintain.mjs,
# which a maintainer runs.
#
# Pushing a `v*` tag by hand still works and is the fallback; the tag
# must equal the manifests' version.
#
# The npm dist-tag follows the version: `1.0.0-beta.2` publishes under
# `beta`, `1.0.0-rc.1` under `rc`, and a plain `1.0.0` under `latest`.
# A prerelease therefore never becomes what a bare `npm install`
# resolves to.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release at a time, and never cancelled halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    # A green CI run for a push to main, a version tag, or a manual run
    # from main. A branch or a pull request cannot reach the publish.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Raised from 30: the scaffold checks CI used to carry run here now,
    # and they take roughly eighteen minutes of it.
    timeout-minutes: 60
    environment: npm
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run checks out main's newest commit; publish the
          # commit CI actually passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — pnpm version from packageManager

      # No dependency cache: a release builds from a clean install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships 10.
      - run: npm install -g npm@11.19.1

      - run: pnpm install --frozen-lockfile

      # The version is the manifests'. Every published workspace must
      # agree (a private one — packages/registry — is skipped), a hand
      # pushed tag must match, and CHANGELOG.md must have the section
      # the release notes come from.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then continue; fi
            v=$(node -p "require('./$dir/package.json').version")
            if [ "$v" != "$version" ]; then
              echo "$dir is $v but packages/core is $version"
              exit 1
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "the tag is v$tag but the manifests are $version"
              exit 1
            fi
          fi
          case "$version" in
            *-*) dist_tag="${version#*-}"; dist_tag="${dist_tag%%.*}" ;;
            *)   dist_tag="latest" ;;
          esac
          # npm refuses a dist-tag that parses as a version range.
          if [[ "$dist_tag" =~ ^[0-9v] ]]; then
            echo "$version would publish under dist-tag \"$dist_tag\"; use a named prerelease (1.0.0-beta.1)"
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "$version under dist-tag $dist_tag"

      # Most CI runs on main are not releases: every package is already
      # on npm at this version and there is nothing to do. A tag pushed
      # after a maintainer published from a workstation lands here too.
      - name: Already on npm?
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          published=true
          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then continue; fi
            name=$(node -p "require('./$dir/package.json').name")
            if ! npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is not on npm yet"
              published=false
            fi
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.published != 'true'
        run: pnpm turbo build

      # Every package's tests, not only the packed-package check: a
      # release is the one place a red suite must not be argued past.
      - if: steps.check.outputs.published != 'true'
        run: pnpm test
        env:
          DATABASE_URL: ""

      # The four checks below ran on every push until they were the
      # reason CI took twenty-two minutes. What they prove is that a
      # consumer can install this — the packed tarballs resolve, the
      # CLI scaffolds an app that boots, every registry item installs
      # into it, and the reference app is still exactly the CLI's
      # output. That is a question about publishing, so it is asked
      # here, where a failure stops the publish instead of a commit.
      #
      # Dummy values for modules that instantiate at import time; this
      # workflow has no job-level env, unlike CI.
      - name: Packed-package compatibility
        if: steps.check.outputs.published != 'true'
        run: |
          set -euo pipefail
          pnpm turbo build
          out=$(mktemp -d)

          # Every relative import in dist carries an extension. tsc
          # emits specifiers verbatim and the sources omit them; the
          # post-build fixer adds them, because Node's ESM loader and
          # vitest's resolver refuse "./foo" — a consumer's scripts and
          # tests are the first to find out.
          if grep -rhoE 'from "\.[^"]*"' packages/*/dist --include='*.js' --include='*.d.ts' | grep -qv '\.js"\|\.css"\|\.json"'; then
            echo "dist contains extensionless relative imports:"
            grep -rnE 'from "\.[^"]*"' packages/*/dist --include='*.js' --include='*.d.ts' | grep -v '\.js"\|\.css"\|\.json"' | head
            exit 1
          fi

          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then continue; fi
            name=$(node -p "require('./$dir/package.json').name")
            (cd "$dir" && pnpm pack --pack-destination "$out" >/dev/null)
            tgz=$(ls "$out"/*.tgz | head -1)
            node -e "
              const {execSync} = require('node:child_process');
              const pkg = require('./$dir/package.json');
              const exp = (pkg.publishConfig && pkg.publishConfig.exports) || {};
              const listed = execSync('tar -tzf ' + JSON.stringify('$tgz'), {encoding:'utf8'})
                .split('\n').map(l => l.replace(/^package\//, ''));
              const missing = [];
              for (const entry of Object.values(exp)) {
                for (const p of typeof entry === 'string' ? [entry] : Object.values(entry)) {
                  if (typeof p !== 'string' || !p.startsWith('./')) continue;
                  if (!listed.includes(p.slice(2))) missing.push(p);
                }
              }
              if (missing.length) {
                console.error(pkg.name + ' publishes exports that are not in the tarball: ' + missing.join(', '));
                process.exit(1);
              }
              console.log(pkg.name + ' ok');
            "
            rm -f "$out"/*.tgz
          done

          # The CLI additionally has to run from the tarball, since it
          # is executed by Node rather than bundled.
          (cd packages/cli && pnpm pack --pack-destination "$out" >/dev/null)
          tar -xzf "$out"/*.tgz -C "$out"
          cd "$out/package"
          node dist/bin.js help
          node dist/bin.js create "$out/scaffolded"
          test -f "$out/scaffolded/lib/intelligo.ts"
          test -f "$out/scaffolded/intelligo.manifest.json"

      - name: A generated app builds and boots
        if: steps.check.outputs.published != 'true'
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/unused
          AUTH_SECRET: ci_dummy_secret_0000000000000000000000000000000000
          BETTER_AUTH_SECRET: ci_dummy_secret_0000000000000000000000000000000000
          CRON_SECRET: ci_dummy_secret_0000000000000000000000000000000000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          RESEND_API_KEY: re_dummy
          OPENAI_API_KEY: sk-dummy
          ANTHROPIC_API_KEY: sk-ant-dummy
          GOOGLE_GENERATIVE_AI_API_KEY: dummy
        run: |
          set -euo pipefail
          rm -rf apps/generated-smoke

          # --link-workspace because this generates inside the monorepo.
          pnpm exec tsx packages/cli/src/bin.ts create apps/generated-smoke --link-workspace

          # A new workspace member changes the lockfile, so this cannot
          # be --frozen-lockfile. The runner is thrown away afterwards.
          pnpm install --no-frozen-lockfile
          pnpm --filter generated-smoke build

          pnpm --filter generated-smoke start &

          # Poll for any answer. A 401 is the expected one, and `curl -f`
          # would treat it as a failure, so this waits on the status
          # code being anything at all rather than on success.
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/gen-body -w '%{http_code}' -X POST \
              http://localhost:3000/api/assistant \
              -H 'content-type: application/json' -d '{"prompt":"ping"}' || true)
            [ "$code" != "000" ] && break
            sleep 2
          done

          echo "generated app answered $code: $(cat /tmp/gen-body 2>/dev/null)"

          # Unauthenticated is the correct answer, and getting it proves
          # the whole chain ran: composition root, auth, the caller of
          # the execution boundary.
          test "$code" = "401"

          # `kill %1` only reaches the pnpm wrapper, and killing the `next
          # start` CLI orphans its `next-server` child, which kept :3000
          # and answered the next step's probe with the wrong app.
          kill %1 2>/dev/null || true
          pkill -f "next-server|next start" 2>/dev/null || true

      # apps/app is generated, not written: `intelligo create` plus
      # `shadcn add` for every item, with only the files in
      # scripts/reference-app-owned.json kept. A diff here means a
      # generated file was edited by hand.
      - name: The reference app is the CLI's output
        if: steps.check.outputs.published != 'true'
        run: pnpm app:regenerate --check

      - name: Registry items install into the generated app
        if: steps.check.outputs.published != 'true'
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/unused
          AUTH_SECRET: ci_dummy_secret_0000000000000000000000000000000000
          BETTER_AUTH_SECRET: ci_dummy_secret_0000000000000000000000000000000000
          CRON_SECRET: ci_dummy_secret_0000000000000000000000000000000000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          RESEND_API_KEY: re_dummy
          OPENAI_API_KEY: sk-dummy
          ANTHROPIC_API_KEY: sk-ant-dummy
          GOOGLE_GENERATIVE_AI_API_KEY: dummy
        run: |
          set -euo pipefail
          pnpm registry:build

          cd apps/generated-smoke

          # Install order is a topological sort of packages/registry/requires.json
          # (an item after the items whose files it imports) — the same
          # file the architecture suite proves matches the code.
          ORDER=$(node -e '
            const { items } = require(process.env.GITHUB_WORKSPACE + "/packages/registry/requires.json");
            const out = [], done = new Set();
            const visit = (n) => { if (done.has(n)) return; done.add(n); for (const d of items[n].items ?? []) visit(d); out.push(n); };
            for (const n of Object.keys(items)) visit(n);
            console.log(out.join(" "));
          ')

          # Items name Intelligo's own components as @intelligo/<name>. Serve
          # the registry this run just built and point the namespace at it,
          # so an item is tested against its siblings, not the deployed site.
          npx --yes http-server@14.1.1 "$GITHUB_WORKSPACE/packages/registry/public/r" -p 8399 -s &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8399/intelligo.json >/dev/null && break; sleep 1; done
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("components.json","utf8"));c.registries={...c.registries,"@intelligo":"http://127.0.0.1:8399/{name}.json"};fs.writeFileSync("components.json",JSON.stringify(c,null,2))'

          echo "installing: $ORDER"
          for item in $ORDER; do
            pnpm exec shadcn add "$GITHUB_WORKSPACE/packages/registry/public/r/$item.json" --yes --overwrite
          done
          cd "$GITHUB_WORKSPACE"
          pnpm install --no-frozen-lockfile
          pnpm --filter generated-smoke build

          # Its own port, so a server left over from the boot step can
          # never answer for this one. The default locale carries no URL
          # prefix (localePrefix "as-needed"), so /registry-smoke is the
          # canonical address; /en/registry-smoke would 307 to it.
          # The scaffold's start script pins --port 3000, so PORT is not
          # enough; invoke next directly on the other port.
          pnpm --filter generated-smoke exec next start --port 3100 &
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/registry-smoke || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          # A page that needs a session must redirect to login, not 404 or
          # 500. The dashboard exists once the items are installed, and
          # pages do not compose on their own — instrumentation.ts does,
          # once per process — so a 500 means the request context was
          # never bound and every signed-in page is broken.
          page=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/dashboard || true)
          echo "unauthenticated /dashboard answered $page"
          kill %1 2>/dev/null || true
          pkill -f "next-server|next start" 2>/dev/null || true
          echo "registry smoke page answered $code"
          test "$code" = "200"
          case "$page" in 302|303|307|308) ;; *) echo "expected a redirect to login"; exit 1 ;; esac

      # `pnpm pack` rewrites workspace:* ranges to the version and swaps
      # in publishConfig; `npm publish` of the tarball is what speaks
      # trusted publishing. core goes first because every other package
      # depends on it, and a version already on the registry is skipped,
      # so a re-run after a partial failure is safe.
      - name: Publish
        if: steps.check.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          for dir in packages/core/ $(ls -d packages/*/ | grep -vx 'packages/core/'); do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then continue; fi
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            rm -f "$out"/*.tgz
            (cd "$dir" && pnpm pack --pack-destination "$out" >/dev/null)
            npm publish "$out"/*.tgz --access public --tag "$DIST_TAG"
          done

      # The tag records which commit shipped; a push by GITHUB_TOKEN
      # does not trigger this workflow again. Runs whether or not this
      # run published, so a release whose run failed after publishing
      # still gets its tag on the next run — and does nothing when the
      # tag exists (a hand-pushed one included).
      - name: Tag
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION exists"
            exit 0
          fi
          prerelease=""
          if [ "$DIST_TAG" != "latest" ]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" $prerelease
