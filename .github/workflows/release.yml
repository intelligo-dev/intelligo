name: Release

# Publishes every public package to npm when main carries a version
# npm does not have yet.
#
# A release is one commit: bump every packages/*/package.json to the
# new version and head CHANGELOG.md with a section for it. Once CI has
# passed on that commit, this workflow builds, runs the full suite,
# packs each package and publishes it, tags the release commit
# `vX.Y.Z` and creates a GitHub release whose notes are that CHANGELOG
# section. Nothing here is a second source of truth: the version is
# what the manifests say, the notes are what the changelog says.
#
# There is no npm token. Every @intelligo-dev package names this file,
# in the `npm` environment of intelligo-dev/intelligo, as its trusted
# publisher; npm checks the run's OIDC identity at publish time and
# attaches provenance. The registry work OIDC cannot do — deprecating
# a folded package, and moving a dist-tag while npm accepts the OIDC
# identity for `publish` only — is scripts/npm-maintain.mjs, which a
# maintainer runs. After a prerelease the publish job says on the run
# when `latest` is behind it.
#
# Three jobs, each holding only what it needs. `verify` installs,
# builds and tests with a read-only token and packs the tarballs;
# `publish` holds the OIDC identity and runs no install, build or
# test — it publishes the packed tarballs; `release` holds the write
# token and runs only `gh` against the API to tag and release.
#
# What ships is the release commit's own tree: the commit that set the
# manifests' version, on main, with a green CI run. Whichever run gets
# there — the release commit's own, or a later commit's when the
# release commit's run was cancelled or failed — builds and publishes
# that commit, never whatever main has become.
#
# Pushing a `v*` tag by hand still works and is the fallback; the tag
# must equal the manifests' version and point at the release commit.
#
# The npm dist-tag follows the version: `1.0.0-beta.2` publishes under
# `beta`, `1.0.0-rc.1` under `rc`, and a plain `1.0.0` under `latest`.
# A prerelease therefore never becomes what a bare `npm install`
# resolves to.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release at a time, and never cancelled halfway through a publish.
# A queued run can still replace another queued one; every run builds
# the release commit, so the one that survives publishes the same tree.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test and pack
    # A green CI run for a push to main, a version tag, or a manual run
    # from main. A branch or a pull request cannot reach the publish.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # The scaffold checks take roughly eighteen minutes of it.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the release commit's CI result
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      published: ${{ steps.check.outputs.published }}
      release-sha: ${{ steps.check.outputs.release-sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run checks out main's newest commit; start from the
          # commit CI actually passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # Nothing in this job writes to the repository.
          persist-credentials: false

      # The version is the manifests'. Every published workspace must
      # agree (a private one — packages/registry — is skipped), a hand
      # pushed tag must match, and CHANGELOG.md must have the section
      # the release notes come from.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/core/package.json').version")
          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then continue; fi
            v=$(node -p "require('./$dir/package.json').version")
            if [ "$v" != "$version" ]; then
              echo "$dir is $v but packages/core is $version"
              exit 1
            fi
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "the tag is v$tag but the manifests are $version"
              exit 1
            fi
          fi
          case "$version" in
            *-*) dist_tag="${version#*-}"; dist_tag="${dist_tag%%.*}" ;;
            *)   dist_tag="latest" ;;
          esac
          # npm refuses a dist-tag that parses as a version range.
          if [[ "$dist_tag" =~ ^[0-9v] ]]; then
            echo "$version would publish under dist-tag \"$dist_tag\"; use a named prerelease (1.0.0-beta.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "$version under dist-tag $dist_tag"

      # Most CI runs on main are not releases: every package is already
      # on npm at this version and there is nothing to publish. A tag
      # pushed after a maintainer published from a workstation lands
      # here too.
      #
      # The release commit is the one that set the version. It must be
      # on main (a hand-pushed tag on another branch publishes nothing)
      # and, when this run is to publish it, have passed CI as a push to
      # main. The rest of this job builds that commit's tree.
      - name: Already on npm?
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=true
          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then continue; fi
            name=$(node -p "require('./$dir/package.json').name")
            if ! npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is not on npm yet"
              published=false
            fi
          done

          release=$(git log -1 --format=%H -S"\"version\": \"$VERSION\"" -- packages/core/package.json)
          if [ -z "$release" ]; then
            echo "::error::no commit sets packages/core to $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release" origin/main; then
            echo "::error::$VERSION was set by $release, which is not on main"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$(git rev-parse HEAD)" != "$release" ]; then
            echo "::error::v$VERSION points at $(git rev-parse --short HEAD), not at $release, the commit that set the version"
            exit 1
          fi
          if [ "$published" != "true" ]; then
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release&event=push&branch=main&status=success" --jq '.total_count')
            if [ "$green" = "0" ]; then
              echo "::error::$VERSION is not on npm and its release commit $release has no green CI run on main yet. Its own run publishes once CI passes; if CI failed there, bump every manifest and head CHANGELOG.md with a new version in one commit."
              exit 1
            fi
            git checkout --quiet "$release"
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "release-sha=$release" >> "$GITHUB_OUTPUT"
          echo "release commit $release; published=$published"

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release/notes.md"

      - if: steps.check.outputs.published != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — pnpm version from packageManager

      # No dependency cache: a release builds from a clean install.
      - if: steps.check.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - if: steps.check.outputs.published != 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.check.outputs.published != 'true'
        run: pnpm turbo build

      # Every package's tests, not only the packed-package check: a
      # release is the one place a red suite must not be argued past.
      # The vocabulary list comes with it, as in CI: a hand-pushed tag
      # is a push build, where the publishability test refuses to run
      # without the list.
      - if: steps.check.outputs.published != 'true'
        run: pnpm test
        env:
          DATABASE_URL: ""
          INTELLIGO_PRIVATE_VOCABULARY: ${{ secrets.PRIVATE_VOCABULARY }}

      # The three checks below prove that a consumer can install this —
      # the packed tarballs resolve, the CLI scaffolds an app that
      # boots, every registry item installs into it, and the reference
      # app is still exactly the CLI's output. That is a question about
      # publishing, so it is asked here, where a failure stops the
      # publish instead of a commit.
      - name: Packed-package compatibility
        if: steps.check.outputs.published != 'true'
        run: |
          set -euo pipefail
          pnpm turbo build
          out=$(mktemp -d)

          # Every relative import in dist carries an extension. tsc
          # emits specifiers verbatim and the sources omit them; the
          # post-build fixer adds them, because Node's ESM loader and
          # vitest's resolver refuse "./foo" — a consumer's scripts and
          # tests are the first to find out.
          if grep -rhoE 'from "\.[^"]*"' packages/*/dist --include='*.js' --include='*.d.ts' | grep -qv '\.js"\|\.css"\|\.json"'; then
            echo "dist contains extensionless relative imports:"
            grep -rnE 'from "\.[^"]*"' packages/*/dist --include='*.js' --include='*.d.ts' | grep -v '\.js"\|\.css"\|\.json"' | head
            exit 1
          fi

          for dir in packages/*/; do
            if [ "$(node -p "require('./$dir/package.json').private === true")" = "true" ]; then continue; fi
            name=$(node -p "require('./$dir/package.json').name")
            (cd "$dir" && pnpm pack --pack-destination "$out" >/dev/null)
            tgz=$(ls "$out"/*.tgz | head -1)
            node -e "
              const {execSync} = require('node:child_process');
              const pkg = require('./$dir/package.json');
              const exp = (pkg.publishConfig && pkg.publishConfig.exports) || {};
              const listed = execSync('tar -tzf ' + JSON.stringify('$tgz'), {encoding:'utf8'})
                .split('\n').map(l => l.replace(/^package\//, ''));
              const missing = [];
              for (const entry of Object.values(exp)) {
                for (const p of typeof entry === 'string' ? [entry] : Object.values(entry)) {
                  if (typeof p !== 'string' || !p.startsWith('./')) continue;
                  if (!listed.includes(p.slice(2))) missing.push(p);
                }
              }
              if (missing.length) {
                console.error(pkg.name + ' publishes exports that are not in the tarball: ' + missing.join(', '));
                process.exit(1);
              }
              console.log(pkg.name + ' ok');
            "
            rm -f "$out"/*.tgz
          done

          # The CLI additionally has to run from the tarball, since it
          # is executed by Node rather than bundled — with the
          # dependencies its packed manifest declares and nothing else,
          # so one it imports without declaring fails here.
          (cd packages/cli && pnpm pack --pack-destination "$out" >/dev/null)
          tar -xzf "$out"/*.tgz -C "$out"
          cd "$out/package"
          npm install --omit=dev --no-package-lock --ignore-scripts --no-audit --no-fund
          node dist/bin.js help
          node dist/bin.js create "$out/scaffolded"
          test -f "$out/scaffolded/lib/intelligo.ts"
          test -f "$out/scaffolded/intelligo.manifest.json"

      # apps/app is generated, not written: `intelligo create` plus
      # `shadcn add` for every item, with only the files in
      # scripts/reference-app-owned.json kept. A diff here means a
      # generated file was edited by hand.
      - name: The reference app is the CLI's output
        if: steps.check.outputs.published != 'true'
        run: pnpm app:regenerate --check

      # What npm will serve, installed the way a consumer installs it:
      # the packed tarballs in an app the packed CLI scaffolds outside
      # this workspace. The bare scaffold and the app with every
      # registry item each type-check, build and answer; see the
      # script's header for what each probe proves.
      - name: A consumer outside the monorepo
        if: steps.check.outputs.published != 'true'
        run: |
          set -euo pipefail
          pnpm registry:build
          scripts/consumer-smoke.sh "$RUNNER_TEMP/consumer-smoke"

      # intelligo.dev/r/<version>/ keeps this release's items, and is
      # frozen once npm has the version: what it holds must be this
      # commit's registry, or the site would serve another tree under the
      # release's name for good.
      - name: The hosted registry is this release's
        if: steps.check.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm sync
          git checkout -- apps/website/src/data/proof.json
          if [ -n "$(git status --porcelain -- "apps/website/public/r/$VERSION")" ]; then
            git status --porcelain -- "apps/website/public/r/$VERSION"
            echo "::error::apps/website/public/r/$VERSION is not this commit's registry. Run pnpm sync in the release commit."
            exit 1
          fi

      # `pnpm pack` rewrites workspace:* ranges to the version and swaps
      # in publishConfig. The tarballs are packed from a fresh build and
      # listed in dependency order (scripts/publish-order.mjs): a package
      # is published after every @intelligo-dev package it names, so npm
      # never serves a version whose sibling is not there yet.
      - name: Pack
        if: steps.check.outputs.published != 'true'
        run: |
          set -euo pipefail
          pnpm turbo build
          out="$RUNNER_TEMP/release"
          : > "$out/order.txt"
          for dir in $(node scripts/publish-order.mjs); do
            name=$(node -p "require('./$dir/package.json').name")
            mkdir -p "$out/$name"
            (cd "$dir" && pnpm pack --pack-destination "$out/$name" >/dev/null)
            echo "$name" >> "$out/order.txt"
          done
          cat "$out/order.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    if: needs.verify.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    # The OIDC identity npm trusts, and nothing else: no checkout, no
    # install, no build — only the tarballs verify packed.
    permissions:
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships 10.
      - run: npm install -g --ignore-scripts npm@11.19.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # In dependency order, each under the version's dist-tag. A version
      # already on the registry is skipped, so a re-run after a partial
      # failure is safe.
      - name: Publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          while read -r name; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
              continue
            fi
            npm publish "$out/$name"/*.tgz --access public --tag "$DIST_TAG"
          done < "$out/order.txt"

      # While no stable version exists, `latest` should follow the newest
      # prerelease, so a bare `npx @intelligo-dev/cli` does not resolve to
      # an old beta. npm accepts this run's OIDC identity for `publish`
      # only, so the move is the maintainer's; this step reads the tag and,
      # when it is behind, says so on the run with the command to run.
      - name: Is latest behind the prerelease?
        if: contains(needs.verify.outputs.version, '-')
        timeout-minutes: 2
        # A reminder: npm failing to answer must not skip the tag and the
        # GitHub release of packages already published.
        continue-on-error: true
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          versions=$(npm view @intelligo-dev/core versions --json)
          if node -e 'process.exit([JSON.parse(process.argv[1])].flat().some((v) => !v.includes("-")) ? 0 : 1)' "$versions"; then
            echo "a stable release exists; latest is this workflow's"
            exit 0
          fi
          latest=$(npm view @intelligo-dev/core dist-tags.latest)
          if [ "$latest" != "$VERSION" ]; then
            echo "::notice title=latest is $latest::npm latest still points at $latest, not $VERSION. A maintainer runs: node scripts/npm-maintain.mjs"
          fi

  release:
    name: Tag and GitHub release
    needs: [verify, publish]
    # After a publish, or when everything was already on npm: a release
    # whose run failed after publishing still gets its tag and release
    # on the next run. Never after a failed or skipped-for-error publish.
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only `gh` against the API runs here: no checkout, no install.
    permissions:
      contents: write # the tag and the GitHub release

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # The tag goes on the release commit — the tree npm shipped — not
      # on whichever commit this run started from. A tag created with
      # GITHUB_TOKEN does not trigger this workflow again; one that
      # exists (a hand-pushed one included) is left as it is.
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.release-sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION exists"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$SHA" >/dev/null
          echo "tagged $SHA as v$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION exists"
            exit 0
          fi
          prerelease=""
          if [ "$DIST_TAG" != "latest" ]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" $prerelease

      # The site's /r and version follow what npm serves, read by `pnpm
      # sync`; main's protection keeps this run from committing it.
      - name: The site still describes the previous release
        if: needs.publish.result == 'success'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: echo "::notice title=Sync intelligo.dev::/r and the site's version follow npm once synced. Commit pnpm sync on main to serve $VERSION; CI's site check fails until then."
