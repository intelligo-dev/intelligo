name: Release

# Publishes every public package to npm when a version tag is pushed.
#
#   git tag v1.0.0-beta.1 && git push origin v1.0.0-beta.1
#
# The tag must equal the version in the package manifests; a mismatch
# fails before anything is published. Needs an `NPM_TOKEN` repository
# secret (an npm automation token with publish rights on @intelligo-dev).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The npm dist-tag follows the version: `1.0.0-beta.2` publishes
      # under `beta`, `1.0.0-rc.1` under `rc`, and a plain `1.0.0` under
      # `latest`. A prerelease therefore never becomes what a bare
      # `npm install` resolves to.
      - name: Tag matches the package version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for dir in packages/*/; do
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "$dir is $version but the tag is $tag"
              exit 1
            fi
          done
          case "$tag" in
            *-*) dist_tag="${tag#*-}"; dist_tag="${dist_tag%%.*}" ;;
            *)   dist_tag="latest" ;;
          esac
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "publishing $tag under dist-tag $dist_tag"

      # A tag can be pushed after a maintainer already published from a
      # workstation. Publishing is then a no-op, and this run stays green
      # instead of failing on a duplicate version (or a missing token).
      - name: Already on npm?
        id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if npm view "@intelligo-dev/core@$tag" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@intelligo-dev/core@$tag is already on npm — build and test only"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm turbo build

      # Every package's tests, not only the packed-package check: a
      # release is the one place a red suite must not be argued past.
      - run: pnpm test
        env:
          DATABASE_URL: ""

      # `pnpm publish -r` orders by dependency, rewrites workspace:*
      # ranges to the published version, and skips versions already on
      # the registry — so a re-run after a partial failure is safe.
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: pnpm publish -r --access public --no-git-checks --tag "${{ steps.version.outputs.dist-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
