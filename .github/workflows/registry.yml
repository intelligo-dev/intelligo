name: Registry

# Serves the page registry over HTTP from GitHub Pages, so consumers
# install items by name instead of from a local checkout:
#
#   https://intelligo-mn.github.io/framework/r/<item>.json
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - ".github/workflows/registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registry-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build registry artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm registry:build

      # An index page so the root URL is not a 404, and the item list
      # is discoverable without reading registry.json.
      - name: Write index
        run: |
          node -e '
            const fs = require("node:fs");
            const registry = require("./registry/registry.json");
            const base = "https://intelligo-mn.github.io/framework/r/";
            const rows = registry.items
              .map((i) => `<li><a href="r/${i.name}.json">${i.name}</a> — ${i.description ?? ""}</li>`)
              .join("\n");
            fs.writeFileSync(
              "registry/public/index.html",
              `<!doctype html><meta charset="utf-8"><title>Intelligo registry</title>
              <h1>Intelligo page registry</h1>
              <p>Install with the shadcn CLI: <code>pnpm exec shadcn add ${base}&lt;item&gt;.json</code></p>
              <ul>${rows}</ul>`
            );
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: registry/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
