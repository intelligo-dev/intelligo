name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token. Nothing in CI writes to the repository; the release
# workflow is the one place that holds write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the older run. A run on
  # main always finishes: the release workflow waits for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dummy values for modules that instantiate at import time (better-auth,
# stripe client, resend) — without them `next build`'s page-data
# collection throws even though no real request is served.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build
  AUTH_SECRET: ci_dummy_secret_0000000000000000000000000000000000
  BETTER_AUTH_SECRET: ci_dummy_secret_0000000000000000000000000000000000
  CRON_SECRET: ci_dummy_secret_0000000000000000000000000000000000
  NEXT_PUBLIC_APP_URL: http://localhost:4002
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  RESEND_API_KEY: re_dummy
  OPENAI_API_KEY: sk-dummy
  ANTHROPIC_API_KEY: sk-ant-dummy
  GOOGLE_GENERATIVE_AI_API_KEY: dummy

jobs:
  # Every job carries a timeout. Without one a hung step burns the
  # default six hours of runner time before anyone notices.
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    # The scaffold checks are not here: they take over twenty minutes,
    # and what they prove — that a consumer can install this — is a
    # question about a release, so the release workflow runs them.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — pnpm version from packageManager

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 — matches Vercel's default runtime for Next.js 16
          # and has util.markAsUncloneable (added in 21.0.0) which
          # zod v4 / ai@6 call during page-data collection.
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo type-check

      - name: Lint
        run: pnpm turbo lint

      # The real suite: root vitest projects config covering every
      # package, the reference app, and the architecture project.
      #
      # DATABASE_URL is emptied for this step only: the job-level dummy
      # exists for `next build`, but the real-database suites gate on
      # the variable being set and would try to connect to it. They run
      # against a live Postgres in the `database` job below.
      #
      # INTELLIGO_PRIVATE_VOCABULARY is the product-name list the
      # publishability test keeps out of the tree. It is a secret, so a
      # fork's pull request runs without it and only the generic rules.
      - name: Unit tests and architecture rules
        env:
          DATABASE_URL: ""
          INTELLIGO_PRIVATE_VOCABULARY: ${{ secrets.PRIVATE_VOCABULARY }}
        run: pnpm test

      # doctor reports the drift that otherwise only shows up when
      # someone provisions a database from the migrations. Blocking:
      # a migration added without a journal entry fails the build
      # instead of silently never running.
      - name: Doctor
        run: pnpm exec tsx packages/cli/src/bin.ts doctor

      # The migration chain is frozen: no migration lands without a
      # deliberate decision recorded here.
      #
      # `intelligo migrate` refuses a db:push-provisioned database, so a
      # new migration cannot reach an unmanaged deployment by the
      # supported path; the only way in would be another `db:push`,
      # which would see a renamed or removed column as absent from the
      # schema file and DROP it. That is what the freeze guards against.
      #
      # 1.0 replaced the pre-1.0 chain with 0000_baseline and
      # 0001_reconcile_chain_built_databases, which adopts a database
      # that ran the old one (see the migrations README). 0002 adds one
      # nullable column (finance_events.claimed_at), which no db:push
      # can lose.
      #
      # Raising it again: confirm `intelligo migrate --check` reports
      # zero pending, then raise FROZEN_AT in the same commit as the
      # first new migration.
      - name: The migration chain is frozen
        run: |
          set -euo pipefail
          FROZEN_AT=3
          entries=$(node -p "require('./packages/core/src/db/migrations/meta/_journal.json').entries.length")
          echo "journal has $entries entries, frozen at $FROZEN_AT"
          if [ "$entries" -gt "$FROZEN_AT" ]; then
            echo "The migration chain is frozen at $FROZEN_AT entries and this branch has $entries."
            echo "See the comment above this step in .github/workflows/ci.yml."
            exit 1
          fi

      # Three checks are deliberately absent here and live in
      # .github/workflows/release.yml instead: packed-package
      # compatibility, the reference app being the CLI's output, and a
      # consumer outside the monorepo installing the tarballs and every
      # registry item into an app that builds and boots. They took eighteen of the twenty-two minutes
      # this job used to run, and what they prove — that a consumer can
      # install what we publish — is a question about a release, not
      # about a commit. A release cannot publish without them.
      # apps/website serves packages/registry/public/r as intelligo.dev/r and renders
      # the items' real components, both as committed copies made by
      # `sync`. A registry change without a re-sync would deploy a stale
      # registry. proof.json is excluded: its sampled date is refreshed
      # by hand at release time.
      - name: Site sync output is committed
        run: |
          set -euo pipefail
          pnpm sync
          git checkout -- apps/website/src/data/proof.json
          git status --porcelain -- apps/website/public/r apps/website/src/data/registry.json apps/website/src/showcase/app
          test -z "$(git status --porcelain -- apps/website/public/r apps/website/src/data/registry.json apps/website/src/showcase/app)"

      - name: Check formatting
        run: pnpm format:check

  # Mutation testing: the source is edited on purpose — an operator
  # flipped, a string emptied — to check that the suite notices. Line
  # coverage cannot answer that, and the modules in scope
  # (stryker.config.mjs) are the ones where not noticing is money or a
  # prompt injection that reaches the model. About a minute; the score
  # dropping below `thresholds.break` fails the job.
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — pnpm version from packageManager

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Emptied for the same reason as the unit-test step: the suites in
      # scope gate on the variable being unset, not on a live database.
      - name: Mutation testing
        env:
          DATABASE_URL: ""
        run: pnpm test:mutation

  database:
    name: Migrations and database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: intelligo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/intelligo_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — pnpm version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # The pgvector image ships the extension but does not enable it in
      # new databases; the schema's vector() columns need the type to
      # exist before anything can create them.
      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      # Replaying the committed .sql files against an empty database is
      # the only thing that proves they are a usable provisioning
      # mechanism.
      - name: Replay the migration chain on a fresh database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -c 'CREATE DATABASE migration_replay;'
          REPLAY_URL="${DATABASE_URL%/*}/migration_replay"
          psql -v ON_ERROR_STOP=1 "$REPLAY_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          for f in packages/core/src/db/migrations/*.sql; do
            echo "--- $f"
            psql -v ON_ERROR_STOP=1 -q "$REPLAY_URL" -f "$f"
          done
          # Columns the running code depends on, which a chain that
          # merely "applied without error" can still be missing.
          psql -v ON_ERROR_STOP=1 "$REPLAY_URL" \
            -c 'SELECT minute_bucket, count FROM rate_limit_entries LIMIT 0;' \
            -c 'SELECT id, request_id, status FROM executions LIMIT 0;' \
            -c 'SELECT active_organization_id, impersonated_by FROM sessions LIMIT 0;' \
            -c 'SELECT id, request_id, expires_at FROM credit_reservations LIMIT 0;' \
            -c 'SELECT id, action, resource_kind FROM audit_events LIMIT 0;' \
            -c 'SELECT execution_id FROM usage_records LIMIT 0;' \
            -c 'SELECT invoice_id, fulfilled_at FROM payments LIMIT 0;'

      # The append-only audit guard is a Postgres trigger (no mock can
      # observe it) and the execution lifecycle rests on a
      # compare-and-swap whose behaviour under concurrent writers a mock
      # proves nothing about. Against the replayed database, because the
      # trigger and the tables come from migrations. One file at a time:
      # the suites share one database, and billing_settings is a single
      # row that billing-settings.int.test.ts deletes and rewrites while
      # money-path.int.test.ts depends on its currency.
      - name: Database integration tests
        env:
          TEST_PG_URL: postgresql://ci:ci@localhost:5432/migration_replay
          DATABASE_URL: postgresql://ci:ci@localhost:5432/migration_replay
        run: |
          pnpm vitest run --no-file-parallelism \
            packages/core/src/db/__tests__ \
            packages/executions/src/__tests__ \
            packages/jobs/src/__tests__ \
            packages/billing/src/__tests__ \
            packages/admin/src/__tests__

      # The replay applied the files directly with psql, so drizzle has
      # no record of them — exactly the "unmanaged" state a
      # push-provisioned database is in. `migrate --check` must say so.
      - name: Migration check reports the replayed database as unmanaged
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/migration_replay
        run: |
          out=$(pnpm exec tsx packages/cli/src/bin.ts migrate --check || true)
          echo "$out"
          # Not "baseline": every pending line names 0000_baseline, so
          # that would match whether or not the state was detected.
          echo "$out" | grep -q "has no migration records"

      # A push-provisioned database must be refused, not half-migrated:
      # `migrate` (apply) sees the tables, sees no records, and stops.
      - name: Migrate refuses the push-provisioned database
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/migration_replay
        run: |
          set -euo pipefail
          if pnpm exec tsx packages/cli/src/bin.ts migrate; then
            echo "migrate should have refused a database with tables but no records"
            exit 1
          fi

      # What a consumer runs: `intelligo migrate` on an empty database,
      # through drizzle's migrator rather than psql, so the records it
      # writes are what `migrate --check` reads back. A second run must
      # be a no-op and the check must report up to date.
      - name: Apply the chain with `intelligo migrate` on an empty database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -c 'CREATE DATABASE migration_apply;'
          APPLY_URL="${DATABASE_URL%/*}/migration_apply"
          psql -v ON_ERROR_STOP=1 "$APPLY_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          DATABASE_URL="$APPLY_URL" pnpm exec tsx packages/cli/src/bin.ts migrate
          DATABASE_URL="$APPLY_URL" pnpm exec tsx packages/cli/src/bin.ts migrate --check
          out=$(DATABASE_URL="$APPLY_URL" pnpm exec tsx packages/cli/src/bin.ts migrate)
          echo "$out"
          echo "$out" | grep -q "Nothing to apply"

      # And the schema pushes cleanly onto an empty database, which is
      # how every development environment is actually provisioned.
      - name: Push schema
        run: pnpm db:push --force

      # The service suites that need real tables — tenant scoping,
      # invitation lifecycle, ownership checks — against the pushed
      # schema. They gate on DATABASE_URL and skip everywhere else.
      # RESEND_API_KEY is emptied here: the job-level dummy makes
      # better-auth require email verification, and sign-up then issues
      # no session — which is what these suites sign up to get.
      - name: Service integration tests (real database)
        env:
          RESEND_API_KEY: ""
          EMAIL_PROVIDER: ""
        run: |
          pnpm vitest run \
            packages/core/src/conversations/service.integration.test.ts \
            packages/core/src/documents/service.integration.test.ts \
            packages/core/src/identity/service.integration.test.ts \
            packages/core/src/attachments/service.integration.test.ts \
            packages/auth/src/team/service.integration.test.ts \
            packages/auth/src/workspace/service.integration.test.ts
